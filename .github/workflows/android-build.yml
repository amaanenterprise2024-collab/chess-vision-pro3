name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ./keystore.jks
          fi

      - name: Locate and make gradlew executable
        run: |
          echo "Files at repo root:"
          ls -la
          echo "Searching for gradlew..."
          GRADLEW=$(find . -maxdepth 6 -type f -name gradlew | head -n1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found — ensure the Gradle wrapper is committed to the repository."
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV

      - name: Set up Android SDK (install build-tools and platforms)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq --no-install-recommends
          yes | sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Using gradlew at: $GRADLEW"
          "$GRADLEW" clean assembleRelease --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/**/*.apk
